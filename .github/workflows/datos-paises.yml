name: datos-paises

# Mantiene al día las series de los países de calcularya.com (ADR 0001, D5 y enmienda del 7/10/2026).
# Un job por mercado corre scripts/datos-paises/correr.ts: detectores, bandas, checks del país y
# check-all. Lo que pasa todo viaja como parche a un único job "publicar", que hace un solo commit a
# main (= deploy en Vercel): una corrida es un deploy, no uno por país. Las normas nunca se publican
# solas: abren o actualizan el issue del país (etiqueta datos-<m>), y eso lo hace el job "issues",
# después de publicar, para que un push fallido nunca cierre un issue con "Todo al día".
#
# Permisos mínimos por job: actualizar corre npm ci y código de terceros, así que no puede escribir
# nada; publicar escribe main pero no corre npm ci y valida cada parche antes de aplicarlo; issues
# solo toca issues y no hace checkout.
#
# Horarios en UTC: 11:20 (mañana en todo LatAm, diarios oficiales del día), 17:20 (mediodía, tipos de
# cambio de la mañana) y 23:50 (cierre de BCRP, Banxico, BanRep y BCU).
#
# Un workflow_dispatch desde una rama que no es main corre los detectores y deja el resumen, pero no
# publica ni toca issues.

on:
  schedule:
    - cron: "20 11 * * *"
    - cron: "20 17 * * *"
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      mercado:
        description: "Código del mercado (vacío = todos los de la matriz)"
        required: false
        default: ""
        type: string

concurrency:
  group: datos-paises
  cancel-in-progress: false

permissions: {}

jobs:
  matriz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mercados: ${{ steps.lista.outputs.mercados }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Mercados registrados con detectores
        id: lista
        env:
          MERCADO: ${{ inputs.mercado }}
        run: |
          if [ -n "$MERCADO" ]; then
            LISTA=$(npx tsx scripts/datos-paises/matriz.ts --mercado "$MERCADO")
          else
            LISTA=$(npx tsx scripts/datos-paises/matriz.ts --detalle)
          fi
          echo "Mercados: $LISTA"
          echo "mercados=$LISTA" >> "$GITHUB_OUTPUT"

  actualizar:
    needs: matriz
    if: needs.matriz.outputs.mercados != '[]' && needs.matriz.outputs.mercados != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mercado: ${{ fromJSON(needs.matriz.outputs.mercados) }}
    env:
      M: ${{ matrix.mercado }}
      SALIDA: .datos-vivos/paises/${{ matrix.mercado }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Los marcadores <!-- norma:... --> de los issues del país, abiertos y cerrados, son la memoria
      # de lo ya avisado: sin esto cada corrida repetiría las mismas normas.
      - name: Memoria de avisos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$SALIDA"
          gh issue list --label "datos-$M" --state all --limit 50 --json number,state,body > "$SALIDA/issues.json" 2>/dev/null || echo "[]" > "$SALIDA/issues.json"

      - name: Correr el runner
        run: npx tsx scripts/datos-paises/correr.ts --mercado "$M" --issues "$SALIDA/issues.json"

      - name: Preparar el parche y el issue
        if: always()
        run: |
          mkdir -p "publicar/$M" "issue/$M"
          if [ -s "$SALIDA/archivos.txt" ]; then
            mapfile -t ARCHIVOS < "$SALIDA/archivos.txt"
            git diff --binary -- "${ARCHIVOS[@]}" > "publicar/$M/cambios.patch"
            cp "$SALIDA/commit.txt" "publicar/$M/commit.txt"
          fi
          for F in issue.md comentario.md titulo.txt etiqueta.txt issue-sin-publicar.md comentario-sin-publicar.md; do
            if [ -f "$SALIDA/$F" ]; then cp "$SALIDA/$F" "issue/$M/$F"; fi
          done

      - uses: actions/upload-artifact@v4
        if: hashFiles(format('publicar/{0}/cambios.patch', matrix.mercado)) != ''
        with:
          name: publicar-${{ matrix.mercado }}
          path: publicar/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('issue/{0}/issue.md', matrix.mercado)) != ''
        with:
          name: issue-${{ matrix.mercado }}
          path: issue/
          retention-days: 3

  publicar:
    needs: [matriz, actualizar]
    if: always() && needs.matriz.result == 'success' && needs.matriz.outputs.mercados != '[]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      publicados: ${{ steps.push.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: publicar-*
          merge-multiple: true
          path: publicar

      # Cada parche viene de un job que corrió código de terceros: antes de aplicarlo se valida que
      # solo modifique src/paises/<m>/series.json de su mercado (scripts/datos-paises/validar-parche.mjs,
      # solo node y git, sin npm ci). Después se aplica sobre el main de ahora y solo si aplica limpio:
      # si alguien tocó el mismo series.json entre la corrida y este paso, ese mercado no se publica y
      # lo reintenta la próxima.
      - name: Validar y aplicar los parches
        run: |
          : > mensaje.txt
          PUBLICADOS=()
          shopt -s nullglob
          for P in publicar/*/cambios.patch; do
            M=$(basename "$(dirname "$P")")
            if ! [[ "$M" =~ ^[a-z]{2,6}$ ]]; then
              echo "::error::Artifact con un mercado inválido: no se aplica."
              continue
            fi
            if ! node scripts/datos-paises/validar-parche.mjs "$M" "$P"; then
              echo "::error::El parche de $M toca algo que no es src/paises/$M/series.json: rechazado."
              continue
            fi
            if git apply --check "$P" && git apply --index "$P"; then
              PUBLICADOS+=("$M")
              cat "$(dirname "$P")/commit.txt" >> mensaje.txt
              echo "" >> mensaje.txt
            else
              echo "::warning::El parche de $M no aplica sobre main: no se publica en esta corrida."
            fi
          done
          if [ ${#PUBLICADOS[@]} -eq 0 ]; then
            echo "Nada que publicar."
            exit 0
          fi
          { echo "datos-paises: ${PUBLICADOS[*]} ($(date -u +%F))"; echo ""; cat mensaje.txt; } > commit.txt
          echo "PUBLICAR=${PUBLICADOS[*]}" >> "$GITHUB_ENV"

      # El autor tiene que ser manu-180 con su noreply: Vercel bloquea (BLOCKED, sin avisar) los deploys
      # cuyo autor no es miembro del equipo del proyecto. "publicados" se exporta solo si el push entró:
      # el job issues lo usa para no cerrar el issue de un mercado que no llegó a main.
      - name: Publicar (commit a main = deploy)
        id: push
        if: env.PUBLICAR != ''
        run: |
          git config user.name "manu-180"
          git config user.email "157671390+manu-180@users.noreply.github.com"
          git commit -q -F commit.txt
          for intento in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "Publicado: $(git log --oneline -1)"
              echo "publicados=$PUBLICAR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          echo "::error::No pude pushear a main después de 5 intentos"
          exit 1

  issues:
    needs: [matriz, actualizar, publicar]
    if: always() && needs.matriz.result == 'success' && needs.matriz.outputs.mercados != '[]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLICADOS: ${{ needs.publicar.outputs.publicados }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: issue-*
          merge-multiple: true
          path: issue

      # issue-sin-publicar.md existe solo si el mercado tenía puntos para publicar. Si el mercado no
      # está en PUBLICADOS (parche rechazado, no aplicó o el push falló), se usa esa variante, que
      # nunca viene vacía: el issue queda abierto y dice que los puntos no llegaron a main.
      - name: Abrir, actualizar o cerrar el issue de cada país
        run: |
          shopt -s nullglob
          for D in issue/*/; do
            M=$(basename "$D")
            if ! [[ "$M" =~ ^[a-z]{2,6}$ ]]; then
              echo "::error::Artifact con un mercado inválido: no toco issues."
              continue
            fi
            CUERPO="$D/issue.md"
            COMENTARIO="$D/comentario.md"
            if [ -f "$D/issue-sin-publicar.md" ] && ! [[ " $PUBLICADOS " == *" $M "* ]]; then
              echo "::warning::$M tenía puntos nuevos que no llegaron a main."
              CUERPO="$D/issue-sin-publicar.md"
              COMENTARIO="$D/comentario-sin-publicar.md"
            fi
            ETIQUETA="datos-$M"
            TITULO=$(head -c 200 "$D/titulo.txt" | tr -d '\r\n')
            ABIERTO=$(gh issue list --state open --label "$ETIQUETA" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -s "$CUERPO" ]; then
              gh label create "$ETIQUETA" --color 1D76DB --description "Avisos del workflow datos-paises" 2>/dev/null || true
              if [ -z "$ABIERTO" ]; then
                gh issue create --title "$TITULO" --label "$ETIQUETA" --body-file "$CUERPO"
              else
                gh issue edit "$ABIERTO" --title "$TITULO" --body-file "$CUERPO"
                if [ -s "$COMENTARIO" ]; then
                  gh issue comment "$ABIERTO" --body-file "$COMENTARIO"
                fi
              fi
            elif [ -n "$ABIERTO" ]; then
              gh issue close "$ABIERTO" --comment "Todo al día: la corrida $RUN_ID no encontró nada pendiente."
            fi
          done
