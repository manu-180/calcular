<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); caret-color: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: "Geist", sans-serif; color: var(--tinta); }
#camara { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 10; }
#portada, #portada-hook, #escena, .bloque { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#subs { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 50; pointer-events: none; }
b, i { display: block; }

/* Chrome de ventana: superficie de la paleta, sombra neutra. */
.ventana { position: absolute; border-radius: 34px; background: var(--superficie); border: 2px solid var(--linea-fuerte); overflow: hidden;
  box-shadow: 0 50px 100px var(--sombra-1), 0 12px 30px var(--sombra-2); }
.barra-sup { position: absolute; left: 0; top: 0; right: 0; height: 100px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-bottom: 2px solid var(--linea); }
.punto { width: 16px; height: 16px; border-radius: 50%; background: var(--linea-fuerte); }
.url { margin-left: 22px; flex: 1; height: 60px; border-radius: 30px; background: var(--fondo); display: flex; align-items: center; gap: 14px; padding: 0 26px;
  font-family: "Geist"; font-weight: 500; font-size: 30px; color: var(--tinta); white-space: nowrap; overflow: hidden; }
.url svg { width: 28px; height: 28px; flex: none; }
.url svg .trazo { fill: none; stroke: var(--tenue); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.carga { position: absolute; left: 0; top: 98px; height: 6px; width: 100%; background: var(--acento); transform-origin: 0 50%; }
.lienzo { position: absolute; left: 0; top: 104px; right: 0; bottom: 0; overflow: hidden; background: #FBFAF7; }

/* La web de muestra: 390 px de ancho (celular) o 1280 (compu), escalada. Barras abstractas: nunca copy inventado. */
.pag { position: absolute; left: 0; top: 0; width: 390px; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; transform-origin: 0 0; background: #FBFAF7; }
.pag-nav { display: flex; align-items: center; gap: 10px; height: 28px; }
.pag-nav .logo { width: 22px; height: 22px; border-radius: 7px; }
.pag-nav .marca { width: 96px; height: 11px; border-radius: 6px; }
.pag-nav .menu { margin-left: auto; display: flex; flex-direction: column; gap: 4px; }
.pag-nav .menu b { width: 20px; height: 3px; border-radius: 2px; }
.pag-fila { display: flex; flex-direction: column; gap: 16px; }
.pag-hero { display: flex; flex-direction: column; gap: 9px; padding-top: 8px; }
.pag-hero .h { height: 22px; border-radius: 6px; }
.pag-hero .p { height: 8px; border-radius: 5px; }
.pag-hero .cta { margin-top: 10px; width: 150px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
.pag-hero .cta b { width: 78px; height: 8px; border-radius: 5px; }
.pag-img { height: 172px; border-radius: 14px; position: relative; overflow: hidden; }
.pag-img svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.pag-tarjetas { display: flex; gap: 10px; }
.pag-tarjetas .c { flex: 1; height: 86px; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
.pag-tarjetas .c i { width: 18px; height: 18px; border-radius: 50%; }
.pag-tarjetas .c b { height: 6px; border-radius: 3px; }
.pag.ancha { width: 1280px; padding: 30px 64px; gap: 34px; }

.pag.ancha .pag-nav .logo { width: 34px; height: 34px; border-radius: 10px; }
.pag.ancha .pag-nav .marca { width: 150px; height: 14px; }
.pag.ancha .pag-nav .menu { flex-direction: row; gap: 34px; }
.pag.ancha .pag-nav .menu b { width: 70px; height: 10px; border-radius: 5px; }
.pag.ancha .pag-fila { flex-direction: row; align-items: center; gap: 56px; }
.pag.ancha .pag-hero { flex: 1; gap: 16px; }
.pag.ancha .pag-hero .h { height: 44px; border-radius: 10px; }
.pag.ancha .pag-hero .p { height: 14px; }
.pag.ancha .pag-hero .cta { width: 230px; height: 62px; border-radius: 31px; }
.pag.ancha .pag-hero .cta b { width: 120px; height: 12px; }
.pag.ancha .pag-img { flex: 1; height: 380px; border-radius: 22px; }
.pag.ancha .pag-tarjetas { gap: 22px; }
.pag.ancha .pag-tarjetas .c { height: 150px; border-radius: 18px; padding: 22px; gap: 12px; }
.pag.ancha .pag-tarjetas .c i { width: 32px; height: 32px; }
.pag.ancha .pag-tarjetas .c b { height: 10px; }
.pag.color .logo, .pag.color .cta, .pag.color .c i { background: var(--acento); }
.pag.color .cta b { background: var(--sobre-acento); }
.pag.color .marca, .pag.color .h { background: #1C1B1A; }
.pag.color .menu b { background: #8E8B85; }
.pag.color .p { background: #C9C6C0; }
.pag.color .c { background: #F0EEE9; }
.pag.color .c b { background: #D3D0CA; }
.pag.color .pag-img { background: linear-gradient(150deg, color-mix(in srgb, var(--acento) 70%, #fff) 0%, var(--acento) 100%); }

.pag.gris .cta b { background: #F1EFEB; }
.pag.gris .c { background: #F3F1ED; }
.pag.gris .pag-img { background: #EFEDE9; }

/* Título */
.v-titulo { position: absolute; left: 110px; width: 850px; font-family: "Geist"; font-weight: 800; line-height: 1.0; letter-spacing: -0.035em; color: var(--tinta); text-wrap: balance; }
.v-titulo span { display: inline-block; }
.v-raya { position: absolute; height: 16px; border-radius: 8px; background: var(--acento); transform-origin: 0 50%; }

/* Búsqueda: un buscador genérico, sin marca. */
.buscador { position: absolute; left: 100px; width: 880px; height: 112px; border-radius: 56px; background: var(--superficie); border: 2px solid var(--linea-fuerte);
  display: flex; align-items: center; gap: 22px; padding: 0 40px; box-shadow: 0 30px 70px var(--sombra-1), 0 8px 20px var(--sombra-2);
  font-family: "Geist"; font-weight: 500; font-size: 42px; color: var(--tinta); white-space: nowrap; overflow: hidden; }
.buscador svg { width: 42px; height: 42px; flex: none; }
.buscador svg .trazo { fill: none; stroke: var(--tenue); stroke-width: 3.2; stroke-linecap: round; }
.buscador .letra { display: inline-block; }
.resultado { position: absolute; left: 100px; width: 880px; height: 168px; border-radius: 30px; background: var(--superficie); border: 2px solid var(--linea);
  display: flex; align-items: center; gap: 28px; padding: 0 36px; box-shadow: 0 18px 40px var(--sombra-2); }
.resultado .fav { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--linea-fuerte);
  font-family: "Geist"; font-weight: 800; font-size: 32px; color: var(--tinta); }
.resultado .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.resultado .dominio { width: 220px; height: 12px; border-radius: 6px; background: var(--linea-fuerte); }
.resultado .titulo { font-family: "Geist"; font-weight: 600; font-size: 40px; line-height: 1.1; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resultado .desc { width: 78%; height: 10px; border-radius: 5px; background: var(--linea); }
.resultado .brillo { position: absolute; left: -2px; top: -2px; right: -2px; bottom: -2px; border-radius: 30px; border: 3px solid var(--acento);
  background: color-mix(in srgb, var(--acento) 13%, transparent); }
.resultado .fav, .resultado .cuerpo { position: relative; z-index: 1; }
.resultado .fav-top { position: absolute; inset: 0; border-radius: 50%; background: var(--acento); color: var(--sobre-acento); display: flex; align-items: center; justify-content: center; }
.resultado .marcador { position: absolute; left: -2px; top: 26px; bottom: 26px; width: 10px; border-radius: 0 6px 6px 0; background: var(--acento); transform-origin: 50% 50%; z-index: 2; }

/* Celular y compu */
.compu-pantalla { position: absolute; left: 130px; top: 360px; width: 680px; height: 430px; border-radius: 26px 26px 10px 10px; background: #0B0B0D; padding: 16px; }
.compu-pantalla .lienzo { left: 16px; top: 16px; right: 16px; bottom: 16px; border-radius: 12px; }
.compu-base { position: absolute; left: 70px; top: 790px; width: 800px; height: 26px; border-radius: 4px 4px 22px 22px; background: color-mix(in srgb, var(--tenue) 55%, var(--superficie)); }
.compu-base i { position: absolute; left: 340px; top: 0; width: 120px; height: 9px; border-radius: 0 0 9px 9px; background: color-mix(in srgb, var(--tenue) 35%, var(--superficie)); }
.tel { position: absolute; left: 690px; top: 560px; width: 240px; height: 480px; border-radius: 42px; background: #0B0B0D; padding: 10px;
  box-shadow: 0 40px 80px var(--sombra-1), 0 10px 24px var(--sombra-2); }
.tel .lienzo { left: 10px; top: 10px; right: 10px; bottom: 10px; border-radius: 33px; }
.tel .isla { position: absolute; left: 92px; top: 22px; width: 56px; height: 16px; border-radius: 8px; background: #0B0B0D; z-index: 2; }
.rotulo { position: absolute; left: 110px; width: 540px; display: flex; flex-direction: column; gap: 10px; }
.rotulo .que { display: flex; align-items: center; gap: 12px; font-family: "Geist Mono"; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tenue); }
.rotulo .que svg { width: 32px; height: 32px; }
.rotulo .que svg .trazo { fill: none; stroke: var(--acento); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.rotulo p { font-family: "Geist"; font-weight: 600; font-size: 46px; line-height: 1.08; letter-spacing: -0.015em; color: var(--tinta); text-wrap: balance; }

/* Comparación */
.lado { position: absolute; left: 110px; width: 860px; border-radius: 40px; padding: 44px 50px 46px; }
.lado.izq { background: var(--superficie); border: 2px solid var(--linea-fuerte); box-shadow: 0 24px 60px var(--sombra-2); }
.lado.der { background: var(--acento); color: var(--sobre-acento); box-shadow: 0 46px 90px var(--sombra-1), 0 10px 26px var(--sombra-2); }
.lado h3 { font-family: "Geist"; font-weight: 800; font-size: 58px; line-height: 1.02; letter-spacing: -0.025em; }
.lado.izq h3 { color: var(--tenue); }
.lado ul { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 16px; }
.lado li { display: flex; align-items: center; gap: 20px; font-family: "Geist"; font-weight: 500; font-size: 40px; line-height: 1.15; }
.lado.izq li { color: var(--tenue); }
.lado li svg { width: 40px; height: 40px; flex: none; }
.lado li svg .trazo { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.lado.izq li svg .trazo { stroke: var(--tenue); }
.lado.der li svg .trazo { stroke: var(--sobre-acento); }

/* Código */
.editor { position: absolute; left: 100px; width: 880px; border-radius: 30px; overflow: hidden; border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 50px 100px var(--sombra-1), 0 12px 30px var(--sombra-2); }
.editor .tapa { height: 80px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-bottom: 2px solid rgba(255,255,255,0.07); }
.editor .tapa .punto { background: rgba(255,255,255,0.16); }
.editor .archivo { margin-left: 18px; height: 46px; padding: 0 20px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center;
  font-family: "Geist Mono"; font-weight: 500; font-size: 24px; color: rgba(255,255,255,0.62); }
.editor .lineas { position: relative; padding: 34px 40px 40px; }
.editor .linea { position: relative; height: 70px; display: flex; align-items: center; font-family: "Geist Mono"; font-weight: 500; font-size: 36px; white-space: pre; }
.editor .foco { position: absolute; left: 0; right: 0; height: 70px; background: rgba(255,255,255,0.07); transform-origin: 0 50%; }
.editor .foco i { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }

/* Cuenta: la operación como un ticket, renglón por renglón, y el resultado en el acento. */
.cuenta { position: absolute; left: 110px; width: 860px; border-radius: 40px; padding: 34px 56px 46px; background: var(--superficie);
  border: 2px solid var(--linea-fuerte); box-shadow: 0 46px 90px var(--sombra-1), 0 10px 26px var(--sombra-2); }
.cuenta .renglon { display: flex; align-items: baseline; justify-content: space-between; gap: 30px; padding: 24px 0; border-bottom: 2px solid var(--linea); }
.cuenta .renglon span { font-family: "Geist"; font-weight: 500; font-size: 46px; line-height: 1.15; letter-spacing: -0.01em; color: var(--tenue); }
.cuenta .renglon b { flex: none; font-family: "Geist Mono"; font-weight: 500; font-size: 52px; color: var(--tinta); font-variant-numeric: tabular-nums; }
.cuenta .raya { height: 0; margin: 14px 0 6px; border-top: 3px dashed var(--linea-fuerte); transform-origin: 0 50%; }
.cuenta .resultado-cuenta { display: flex; align-items: baseline; justify-content: space-between; gap: 30px; padding-top: 22px; }
.cuenta .resultado-cuenta span { font-family: "Geist"; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -0.03em; color: var(--tinta); }
.cuenta .resultado-cuenta b { flex: none; font-family: "Geist"; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.045em; color: var(--acento); }
</style>
</head>

<script>

  V.busqueda = function (v, raiz) {

  // Resaltado simple de HTML, CSS y JS: alcanza para 2-5 líneas de muestra.
  var TOKEN = /(\/\/.*$|\/\*.*?\*\/|<!--.*?-->)|("[^"]*"?|'[^']*'?|`[^`]*`?)|(<\/?[A-Za-z][\w-]*|\/?>)|(@[a-z-]+|\b(?:const|let|var|function|return|if|else|for|while|import|export|from|await|async|new|class|true|false|null)\b)|(\b[a-zA-Z-]+(?==)|\b[a-z-]+(?=\s*:))|([.#][A-Za-z][\w-]*)|(\b\d+(?:\.\d+)?(?:px|%|em|rem|vh|vw|s|ms)?\b)|([{}()[\];:,=<>])/g;
  function resaltar(linea, S) {
    var frag = document.createDocumentFragment();
    var ult = 0, m;
    function pone(txt, color) {
      if (!txt) return;
      var s = document.createElement("span");
      s.textContent = txt;
      s.style.color = color;
      frag.appendChild(s);
    }
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(linea))) {
      pone(linea.slice(ult, m.index), S.texto);
      var c = m[1] ? S.comentario : m[2] ? S.cadena : m[3] || m[4] ? S.clave : m[5] ? S.atributo : m[6] ? S.clave : m[7] ? S.cadena : S.signo;
      pone(m[0], c);
      ult = m.index + m[0].length;
    }
    pone(linea.slice(ult), S.texto);
    return frag;
  }

    var todo = lineas.join("\n");
    if (/^\s*</.test(todo)) return "index.html";
    if (/(^|\n)\s*(@media|[.#]?[a-z][\w-]*\s*\{)|:\s*[^;]+;/.test(todo) && !/\b(const|let|function|=>)\b/.test(todo)) return "estilos.css";
    return "app.js";
  }

  V.codigo = function (v, raiz) {

  function construir() {
    var tl = gsap.timeline({ paused: true });
    var E = R.empuje;

    var hook = Subtitulos.montar(tl, { contenedor: document.getElementById("portada-hook"), grupos: [R.hook], tono: R.tono, resalte: R.resalte, tinta: R.tinta, prefijo: "hook" })[0];

    });

    tl.set({}, {}, R.duracion);
    window.__timelines["main"] = tl;
  }

  Subtitulos.fuentes().then(construir, construir);
